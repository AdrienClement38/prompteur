# Configuration des outils de qualité / sécurité Python.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, puis flake8-bugbear : bugbear ne juge pas le style,
# il traque les pièges qui deviennent des bugs (argument par défaut mutable, except
# trop large, variable de boucle capturée dans une closure, assert sur un tuple…).
# Ajouté avec le durcissement anti-CSRF : le code à venir (modes de pédalier,
# rendu de mise en forme) manipulera boucles et fermetures, là où ces pièges vivent.
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]            # import après sys.path.insert (nécessaire pour importer server)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", ".git"]
