<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Prompteur — Tableau de bord</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1115">
  <style>
    /* Taillé pour le petit écran du boîtier : 480 x 320, tactile RÉSISTIF.
       Un tactile résistif se pilote à l'ongle ou au stylet, jamais à la pulpe :
       les cibles doivent être grandes et bien séparées, et rien ne doit dépendre
       d'un geste fin. Tout tient sans défilement : sur un écran de la taille
       d'une carte bancaire, une barre de défilement est inutilisable. */
    :root{
      --bg:#0f1115; --card:#20242e; --line:#2b3040; --fg:#eef1f6; --muted:#9aa3b2;
      --accent:#4f8cff; --go:#2fbf71; --warn:#e5b53a; --danger:#e2544a;
    }
    *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
    html,body{height:100%; overflow:hidden;}
    body{
      background:var(--bg); color:var(--fg);
      font:15px/1.3 system-ui,'Segoe UI',Roboto,Arial,sans-serif;
      display:flex; flex-direction:column; padding:8px; gap:8px;
    }

    header{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
    header .dot{width:9px; height:9px; border-radius:50%; background:var(--go);
      box-shadow:0 0 8px var(--go); flex:0 0 auto;}
    header .dot.off{background:var(--muted); box-shadow:none;}
    header h1{font-size:15px; font-weight:700;}
    header .etat{margin-left:auto; font-size:12px; color:var(--muted); text-align:right;}

    .grille{flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; gap:8px; min-height:0;}
    .b{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:3px; text-align:center; text-decoration:none; cursor:pointer;
      background:var(--card); color:var(--fg);
      border:1px solid var(--line); border-radius:12px;
      font-size:17px; font-weight:700; padding:6px; min-height:0;
    }
    .b .sous{font-size:11px; font-weight:400; color:var(--muted); line-height:1.2;}
    .b:active{transform:translateY(1px);}
    .b.principal{background:var(--accent); border-color:var(--accent); color:#fff;}
    .b.principal .sous{color:rgba(255,255,255,.8);}
    .b.go{background:var(--go); border-color:var(--go); color:#04240f;}
    .b.go .sous{color:rgba(4,36,15,.75);}
    .b.stop{border-color:#43272a; color:var(--danger);}
    .b:disabled{opacity:.4;}

    footer{
      flex:0 0 auto; display:flex; align-items:center; gap:8px;
      font-size:12px; color:var(--muted); padding:0 2px;
    }
    footer .adresse{font-family:'Consolas',monospace; color:var(--fg);}
    footer .wifi{margin-left:auto;}
    footer b{color:var(--fg);}
  </style>
</head>
<body>
  <header>
    <span class="dot off" id="voyant"></span>
    <h1>Le Prompteur</h1>
    <span class="etat" id="etat">…</span>
  </header>

  <div class="grille">
    <a class="b principal" href="/display" id="bPrompteur">
      ▶ Prompteur
      <span class="sous">l'écran de lecture</span>
    </a>
    <a class="b" href="/">
      Télécommande
      <span class="sous">coller un texte, régler</span>
    </a>
    <a class="b" href="/view">
      Écran régie
      <span class="sous">suit en lecture seule</span>
    </a>
    <button class="b stop" id="bFermer">
      Fermer
      <span class="sous">revenir au bureau</span>
    </button>
  </div>

  <footer>
    À taper sur le téléphone : <span class="adresse" id="adresse">…</span>
    <span class="wifi">WiFi <b>Prompteur</b></span>
  </footer>

  <script src="/static/menu.js"></script>
</body>
</html>
